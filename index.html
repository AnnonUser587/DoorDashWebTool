<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OfferDex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
/* Layout: one phone column; home = collection with a thumb-reach scan bar; scans open a full-screen result sheet (verdict first, card second) */
:root{
  --bg:#0b0c10; --bg2:#13151c; --panel:#171a23; --line:#262a36; --tx:#eef0f5; --mut:#8a90a2; --dim:#5d6375;
  --gold:#e8c26a; --silver:#c9ccd6;
  --accept:#3ddc84; --consider:#f5b83d; --decline:#ff5c5c;
  --t-trash:#9a8a74; --t-common:#4cc9a6; --t-rare:#5f8dff; --t-epic:#b27dff; --t-legendary:#f3c55a;
  --f-display:"Chakra Petch","Avenir Next Condensed","Arial Narrow",sans-serif;
  --f-body:"Figtree",-apple-system,system-ui,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx)}
html.lock,html.lock body{overflow:hidden}
body{font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--t-rare);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(110px + env(safe-area-inset-bottom,0px))}
#file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.logo{display:flex;align-items:center;gap:10px;font:700 1.6rem/1 var(--f-display)}
.logo svg{width:34px;height:34px}
.count{font:500 .7rem/1 var(--f-mono);letter-spacing:.16em;color:var(--mut);text-transform:uppercase;text-align:right}
.count b{display:block;font:600 1.4rem/1 var(--f-display);color:var(--tx);letter-spacing:0;margin-bottom:4px}

/* stats + filters */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat b{display:block;font:600 1.25rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font:500 .6rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 8px;padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:40px;border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:8px 14px;font-weight:600;font-size:.88rem;color:var(--mut);cursor:pointer;display:flex;gap:7px;align-items:center}
.fchip i{width:8px;height:8px;border-radius:99px;background:var(--c,var(--mut))}
.fchip i.holo{background:conic-gradient(#ff4fa0,#ffd84f,#4fffc1,#4fb5ff,#c44fff,#ff4fa0)}
.fchip[aria-pressed="true"]{background:#272b37;color:var(--tx);border-color:#3a3f4e}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .card{cursor:pointer;transition:transform .18s ease}
.grid .card:active{transform:scale(.97)}
.grid .card.new{animation:pop .7s cubic-bezier(.2,.9,.25,1.2)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.none{grid-column:1/-1;text-align:center;color:var(--mut);padding:28px 16px;border:1px dashed var(--line);border-radius:16px}

/* empty dex */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:18px 4px 6px}
.fan{position:relative;width:170px;height:150px}
.fan span{position:absolute;left:50%;bottom:0;width:86px;height:120px;border-radius:12px;border:1.5px solid var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 25%,#14161e),#0f1117);transform-origin:50% 120%}
.fan span:nth-child(1){--c:var(--t-rare);transform:translateX(-50%) rotate(-16deg)}
.fan span:nth-child(2){--c:var(--t-epic);transform:translateX(-50%) rotate(16deg)}
.fan span:nth-child(3){--c:var(--t-legendary);transform:translateX(-50%);display:grid;place-items:center;font:700 1.6rem var(--f-display);color:var(--t-legendary)}
.empty h2{font:600 1.35rem/1.2 var(--f-display);margin:0}
.empty p{margin:0;color:var(--mut);max-width:34ch}
.ladder{width:100%;display:grid;gap:6px;margin-top:6px;text-align:left}
.lrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem}
.lrow i{width:10px;height:10px;border-radius:99px;background:var(--c)}
.lrow b{font-weight:600}.lrow b small{font:500 .72rem var(--f-mono);color:var(--mut);margin-left:6px}
.lrow span{font:500 .72rem var(--f-mono);color:var(--mut);text-align:right}
.lhead{font:500 .66rem/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;padding:4px 2px}

/* bottom scan bar */
.scanbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 40%)}
.scanbtn{max-width:528px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:99px;background:var(--tx);color:var(--bg);font:700 1.08rem var(--f-body);cursor:pointer;box-shadow:0 10px 30px -10px #000}
.scanbtn svg{width:24px;height:24px}
.hint{text-align:center;font-size:.75rem;color:var(--dim);margin-top:8px}
@media (hover:none){.hint{display:none}}

/* ===== the trading card (sizes in cqw so mini + full share one design) ===== */
.card{--c:var(--t-common);--mx:50%;--my:50%;container-type:inline-size;position:relative;border-radius:5.5cqw;padding:2.2cqw;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,#14161e),#0f1117 45%,color-mix(in srgb,var(--c) 14%,#0f1117));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent),0 10px 30px -12px color-mix(in srgb,var(--c) 55%,transparent);min-width:0}
.card .in{container-type:inline-size;border-radius:4.2cqw;border:1px solid color-mix(in srgb,var(--c) 30%,#2b2f3b);background:#11131a;padding:4cqw 4cqw 3cqw;display:flex;flex-direction:column;gap:3cqw;overflow:hidden;position:relative;isolation:isolate}
.card[data-t="trash"]{--c:var(--t-trash)}.card[data-t="common"]{--c:var(--t-common)}.card[data-t="rare"]{--c:var(--t-rare)}.card[data-t="epic"]{--c:var(--t-epic)}.card[data-t="legendary"]{--c:var(--t-legendary)}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:2cqw}
.pill{display:inline-flex;align-items:center;gap:1.6cqw;border-radius:99px;padding:1.2cqw 2.8cqw 1.2cqw 1.6cqw;font:600 3.1cqw/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;
  background:color-mix(in srgb,var(--c) 22%,#1b1e27);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);white-space:nowrap}
.pill .orb{width:4.4cqw;height:4.4cqw;border-radius:99px;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 45%,color-mix(in srgb,var(--c) 40%,#000) 100%)}
.pill b{font-weight:600;color:var(--tx);opacity:.8;margin-left:.6cqw}
.rate{border:1px solid #2e3240;border-radius:99px;padding:1.2cqw 3cqw;font:600 4.4cqw/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.rate small{font:600 2.6cqw var(--f-mono);color:var(--gold);margin-left:.6cqw}
.c-name{font:600 6.4cqw/1.1 var(--f-display);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:3cqw;overflow:hidden;background:#1a1d27;border:1px solid #2a2e3a}
.art img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.15) contrast(1.05)}
.art .no{position:absolute;left:2cqw;top:2cqw;font:600 2.8cqw/1 var(--f-mono);background:#0b0c10cc;border-radius:1.6cqw;padding:1.2cqw 1.8cqw}
.art .fin{position:absolute;right:2cqw;top:2cqw;font:700 2.5cqw/1 var(--f-mono);letter-spacing:.12em;border-radius:1.6cqw;padding:1.2cqw 1.8cqw;background:#0b0c10cc;color:#fff}
.art .fallback{position:absolute;inset:0;display:grid;place-items:center;font:600 12cqw var(--f-display);color:color-mix(in srgb,var(--c) 60%,#fff);
  background:repeating-linear-gradient(135deg,#171a23 0 3cqw,#1b1f2a 3cqw 6cqw)}
.strip{border-radius:99px;background:#1b1e27;border:1px solid #2a2e3a;text-align:center;font:500 2.9cqw/1 var(--f-mono);padding:2cqw;color:var(--silver);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip i{font-style:normal;color:var(--gold);margin:0 1.4cqw}
.box{border-radius:3cqw;border:1px solid #2a2e3a;background:#151820;padding:2cqw;display:flex;flex-direction:column;gap:2cqw}
.val{border-radius:2.4cqw;padding:2.2cqw 3.2cqw;display:flex;justify-content:space-between;align-items:flex-end;gap:2cqw;color:#15130e;
  background:linear-gradient(90deg,var(--gold) 0%,#e9d9b0 45%,var(--silver) 100%)}
.val span{display:block;font:600 2.2cqw/1 var(--f-mono);letter-spacing:.14em;opacity:.7;margin-bottom:1cqw}
.val b{font:600 6.4cqw/1 var(--f-display);font-variant-numeric:tabular-nums}
.val .r{text-align:right}.val .r b{font-size:4.4cqw;letter-spacing:.02em}
.specs{display:grid;grid-template-columns:1fr 1fr;border:1px solid #2a2e3a;border-radius:2.4cqw;overflow:hidden}
.specs div{padding:2cqw 2.6cqw;min-width:0}
.specs div:nth-child(odd){border-right:1px solid #2a2e3a}.specs div:nth-child(-n+2){border-bottom:1px solid #2a2e3a}
.specs span{display:block;font:500 2.2cqw/1 var(--f-mono);letter-spacing:.12em;color:var(--mut);margin-bottom:1.2cqw}
.specs b{font:600 3.3cqw/1.1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.quote{font:italic 400 2.9cqw/1.4 var(--f-mono);color:var(--silver);border-left:.7cqw solid var(--c);padding-left:2.4cqw;margin:0}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:2cqw;font:500 2.3cqw/1 var(--f-mono);letter-spacing:.16em;color:var(--dim)}
.c-foot .rule{flex:1;height:1px;background:linear-gradient(90deg,#2a2e3a,transparent)}
.c-foot b{color:var(--c);letter-spacing:.06em;font-weight:600}
/* standard foil glint on rare and up */
.card[data-t="rare"] .in::after,.card[data-t="epic"] .in::after,.card[data-t="legendary"] .in::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:4;
  background:linear-gradient(115deg,transparent 35%,color-mix(in srgb,var(--c) 18%,transparent) 45%,rgba(255,255,255,.08) 50%,transparent 60%);background-size:250% 100%;background-position:120% 0;mix-blend-mode:screen}
.card[data-t="legendary"]{box-shadow:0 0 0 1px var(--t-legendary),0 0 24px -4px color-mix(in srgb,var(--t-legendary) 70%,transparent),0 14px 40px -12px color-mix(in srgb,var(--t-legendary) 60%,transparent)}
.card[data-t="legendary"] .in::after,.card[data-t="epic"] .in::after{animation:foil 4.5s ease-in-out infinite}
@keyframes foil{0%,60%{background-position:120% 0}100%{background-position:-120% 0}}

/* ---- special finishes ---- */
/* Holographic: rainbow frame + a moving prism layer over the whole face */
.card[data-f="holo"]{background:conic-gradient(from 0deg at var(--mx) var(--my),#ff4fa0,#ffd84f,#4fffc1,#4fb5ff,#c44fff,#ff4fa0);
  box-shadow:0 0 0 1px #ffffff55,0 0 28px -6px #c44fffaa,0 14px 40px -14px #4fb5ffaa}
.card[data-f="holo"] .in::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:inherit;mix-blend-mode:color-dodge;opacity:.55;
  background:repeating-linear-gradient(115deg,#ff4fa055 0,#ffd84f55 6%,#4fffc155 12%,#4fb5ff55 18%,#c44fff55 24%,#ff4fa055 30%),
             radial-gradient(circle at var(--mx) var(--my),#ffffff40,transparent 45%);
  background-size:300% 300%,100% 100%;animation:holo 6s linear infinite}
.card[data-f="holo"] .art .fin{background:linear-gradient(90deg,#ff4fa0,#ffd84f,#4fffc1,#4fb5ff,#c44fff);color:#111}
@keyframes holo{to{background-position:300% 300%,0 0}}
/* Carbon fiber: woven frame and face, glossy sweep */
.card[data-f="carbon"],.card[data-f="carbon"] .in{
  background:
    linear-gradient(27deg,#151515 1.2cqw,transparent 1.2cqw) 0 1.2cqw,
    linear-gradient(207deg,#151515 1.2cqw,transparent 1.2cqw) 2.4cqw 0,
    linear-gradient(27deg,#262626 1.2cqw,transparent 1.2cqw) 0 2.4cqw,
    linear-gradient(207deg,#262626 1.2cqw,transparent 1.2cqw) 2.4cqw 1.2cqw,
    linear-gradient(90deg,#1b1b1b 2.4cqw,transparent 2.4cqw),
    linear-gradient(#1d1d1d 25%,#1a1a1a 25%,#1a1a1a 50%,transparent 50%,transparent 75%,#242424 75%,#242424);
  background-color:#131313;background-size:4.8cqw 4.8cqw}
.card[data-f="carbon"]{box-shadow:0 0 0 1px #6b6b6b,0 0 0 2px var(--c),0 14px 34px -12px #000}
.card[data-f="carbon"] .in::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(120deg,transparent 30%,#ffffff1c 48%,transparent 62%);background-size:260% 100%;animation:foil 3.8s ease-in-out infinite}
.card[data-f="carbon"] .art .fin{background:#e9e9e9;color:#111}
/* Inverted: the whole face flips to negative */
.card[data-f="inverted"]{background:linear-gradient(160deg,#f2f3f7,#d9dbe3);box-shadow:0 0 0 1px #fff,0 0 0 2.5px var(--c),0 14px 34px -14px #fff6}
.card[data-f="inverted"] .in{filter:invert(1) hue-rotate(180deg)}

/* ===== result sheet ===== */
.sheet{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .col{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
.close{align-self:flex-end;width:44px;height:44px;border-radius:99px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.close svg{width:18px;height:18px}
.shot{position:relative;width:min(240px,64%);margin:0 auto;border-radius:18px;overflow:hidden;border:1px solid var(--line);transition:opacity .7s ease,filter .7s ease,transform .7s ease,max-height .7s ease,margin .7s ease;max-height:60vh}
.shot img{display:block;width:100%}
.shot .beam{position:absolute;left:0;right:0;height:22%;top:-22%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--t-rare) 35%,transparent) 70%,var(--t-rare) 100%);opacity:0}
.shot.scanning .beam{opacity:.85;animation:beam 1.5s linear infinite}
@keyframes beam{to{top:100%}}
.shot.gone{opacity:0;filter:blur(14px) brightness(1.6);transform:scale(.85);max-height:0;margin-block:-7px;border-width:0}
.status{text-align:center;display:grid;gap:8px}
.status p{margin:0;color:var(--mut);font-size:.95rem}
.bar{height:6px;border-radius:99px;background:#252935;overflow:hidden;width:min(240px,64%);margin:0 auto}.bar i{display:block;height:100%;width:0;background:var(--t-rare);transition:width .3s}

.verdict{--v:var(--accept);border-radius:22px;padding:18px 18px 16px;text-align:center;border:1.5px solid color-mix(in srgb,var(--v) 70%,transparent);
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--v) 26%,transparent),transparent 70%),var(--panel);animation:vin .5s cubic-bezier(.2,.9,.25,1.2) both}
.verdict[data-v="consider"]{--v:var(--consider)}.verdict[data-v="decline"]{--v:var(--decline)}
@keyframes vin{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
.verdict .vk{font:500 .7rem/1 var(--f-mono);letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
.verdict .vw{font:700 clamp(2.6rem,14vw,3.6rem)/1 var(--f-display);color:var(--v);letter-spacing:.02em;margin:8px 0 6px;text-transform:uppercase}
.verdict .vl{color:var(--tx);font-weight:600}
.vnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:14px}
.vnums div{background:#0f1117;border-radius:12px;padding:9px 4px}
.vnums b{display:block;font:600 1.15rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.vnums span{font:500 .58rem/1 var(--f-mono);letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.vwhy{margin:10px 0 0;font-size:.82rem;color:var(--mut)}
.pull{text-align:center;font:700 .8rem/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;animation:vin .5s .55s both}
.pull.holo{background:linear-gradient(90deg,#ff4fa0,#ffd84f,#4fffc1,#4fb5ff,#c44fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pull.carbon{color:#d6d6d6}.pull.inverted{color:#fff}
.reveal{position:relative;width:min(340px,100%);margin:0 auto;perspective:1200px}
.reveal .card{transform-origin:50% 60%;animation:flip .9s .35s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes flip{0%{transform:rotateY(-95deg) scale(.7);opacity:0;filter:brightness(2.5)}60%{opacity:1}100%{transform:none;filter:none}}
.burst{position:absolute;inset:-10% -20%;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--bc) 50%,transparent),transparent);opacity:0;animation:burst 1.4s ease-out .6s}
@keyframes burst{0%{opacity:0;transform:scale(.4)}30%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;padding-top:4px}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border:0;border-radius:16px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--tx);color:var(--bg);width:100%;text-align:center}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.dup{border-radius:20px;border:1.5px solid color-mix(in srgb,var(--consider) 60%,transparent);background:var(--panel);padding:16px;text-align:center}
.dup h2{font:700 1.4rem/1.2 var(--f-display);margin:0 0 4px;color:var(--consider)}
.dup p{margin:0;color:var(--mut);font-size:.92rem}
.dup .mini{width:min(220px,62%);margin:14px auto 0}
.linkbtn{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:.88rem;padding:10px;cursor:pointer}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font:600 1.15rem/1.2 var(--f-display);margin:0}
.msg{margin:0;font-size:.9rem;color:var(--mut)}.msg.err{color:var(--decline)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:flex;flex-direction:column;gap:5px;font:500 .66rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);min-width:0}
.fields label.full{grid-column:1/-1}

<script>
/* OfferDex core: parse OCR text from a delivery offer and score it 1-100.
   Pure functions, no DOM. Works in the browser (window.OfferCore) and in Node (require). */
(function (root) {
  "use strict";

  /* ---------- 1. Parsing ---------- */

  // Common OCR slips on digits: "S9.05" for "$9.05", "O" for 0, "l" for 1.
  function normalize(text) {
    return String(text || "")
      .replace(/\r/g, "")
      .replace(/[“”]/g, '"')
      .replace(/(^|\s)[S§](?=\d{1,3}[.,]\d{2}\b)/g, "$1$")  // S9.05 -> $9.05
      .replace(/\$\s+(?=\d)/g, "$")                          // "$ 9.05"
      .replace(/(\d),(\d{2})\b/g, "$1.$2");                  // 9,05 -> 9.05
  }

  const num = s => (s == null ? null : parseFloat(String(s).replace(/[Oo]/g, "0").replace(/[lI]/g, "1")));

  /**
   * Pull pay / minutes / miles / stops (plus store name when it can) out of OCR text.
   * Handles DoorDash ("$9.05 incl. tips / 2 stops (7.0 mi) • 23 min") and
   * Uber Eats ("$8.50 incl. expected tip / 22 min (6.8 mi) total") layouts.
   * Every field may come back null; the UI asks the user to fill those in.
   */
  function parseOfferText(raw) {
    const text = normalize(raw);
    const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
    const out = { pay: null, minutes: null, miles: null, stops: null, store: null, platform: null };

    // Pay: prefer an amount next to "incl"/"tip"/"guaranteed"; otherwise the largest $ amount.
    const pays = [];
    lines.forEach((l, i) => {
      const re = /\$(\d{1,3}(?:\.\d{1,2})?)/g;
      let m;
      while ((m = re.exec(l))) {
        const v = num(m[1]);
        if (/^\s*\/\s*(hr|h|hour|mi|mile)/i.test(l.slice(m.index + m[0].length))) continue;  // a rate, not the payout
        if (v > 0 && v < 500) pays.push({ v, i, hint: /incl|tip|guarant|total|est/i.test(l) });
      }
    });
    if (pays.length) {
      const hinted = pays.filter(p => p.hint);
      out.pay = (hinted.length ? hinted : pays).reduce((a, b) => (b.v > a.v ? b : a)).v;
    }

    // Use the line holding the trip summary if there is one, so map labels like "FM 1093" can't interfere.
    const tripLine = lines.find(l => /\bmi\b|\bmiles?\b/i.test(l) && /\bmin/i.test(l)) || text;

    const mi = tripLine.match(/(\d{1,3}(?:\.\d)?)\s*(?:mi|miles?)\b/i) || text.match(/(\d{1,3}(?:\.\d)?)\s*(?:mi|miles?)\b/i);
    if (mi) out.miles = num(mi[1]);

    // "1 hr 5 min" or "23 min"
    const hr = tripLine.match(/(\d{1,2})\s*(?:hr|hour)s?\s*(\d{1,2})?\s*(?:min)?/i);
    const mn = tripLine.match(/(\d{1,3})\s*min/i) || text.match(/(\d{1,3})\s*min/i);
    if (hr) out.minutes = num(hr[1]) * 60 + (hr[2] ? num(hr[2]) : 0);
    else if (mn) out.minutes = num(mn[1]);

    const st = text.match(/(\d{1,2})\s*stops?\b/i);
    if (st) out.stops = num(st[1]);
    else {
      // Uber style lists each stop; count pickups + dropoffs, minimum one of each.
      const p = (text.match(/pick\s*-?\s*up/gi) || []).length;
      const d = (text.match(/drop\s*-?\s*off|deliver(?:y)? to/gi) || []).length;
      if (p || d) out.stops = Math.max(1, p) + Math.max(1, d);
    }

    if (/incl\.?\s*tips?\b|dasher|decline/i.test(text)) out.platform = "DoorDash";
    if (/expected tip|uber|exclusive|trip/i.test(text) && !/incl\.?\s*tips/i.test(text)) out.platform = out.platform || "Uber Eats";

    // Store: first line after the trip summary that isn't an address, an icon read as letters, or a button.
    const ti = lines.findIndex(l => l === tripLine);
    if (ti >= 0) {
      for (const l of lines.slice(ti + 1, ti + 4)) {
        // the store icon often reads as "f@" or "f": drop a leading lowercase 1-2 letter token or symbols
        const clean = l.replace(/^(?:[^A-Za-z0-9\s]+|[a-z]{1,2}[@©®]?)\s+(?=\S)/, "").replace(/^[^A-Za-z0-9'&]+/, "").trim();
        if (!clean || /^\d+\s/.test(clean) || /customer|drop\s*-?\s*off|pick\s*-?\s*up|view items|accept|decline|incl|total/i.test(clean)) continue;
        if (clean.length >= 2) { out.store = clean.slice(0, 40); break; }
      }
    }
    return out;
  }

  /* ---------- 2. Scoring ---------- */

  // Piecewise-linear lookup: pts = [[x, score], ...] sorted by x.
  function curve(x, pts) {
    if (x <= pts[0][0]) return pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      const [x1, y1] = pts[i], [x0, y0] = pts[i - 1];
      if (x <= x1) return y0 + ((x - x0) / (x1 - x0)) * (y1 - y0);
    }
    return pts[pts.length - 1][1];
  }

  // Anchor points chosen so the thresholds in the spec land on tier edges.
  const PPH_CURVE = [[8, 0], [15, 30], [20, 60], [22, 72], [25, 88], [32, 100]];
  const PPM_CURVE = [[0.5, 0], [1.0, 30], [1.3, 50], [1.5, 65], [2.0, 88], [2.75, 100]];
  const W_PPH = 0.55, W_PPM = 0.45;

  const TIERS = [
    { id: "legendary", name: "Legendary", min: 91, max: 100, blurb: "God-tier. Take it before someone else does." },
    { id: "epic",      name: "Epic",      min: 76, max: 90,  blurb: "Great money for the miles." },
    { id: "rare",      name: "Rare",      min: 51, max: 75,  blurb: "A good, solid offer." },
    { id: "common",    name: "Common",    min: 26, max: 50,  blurb: "Barely worth the gas." },
    { id: "trash",     name: "Trash",     min: 1,  max: 25,  blurb: "Decline and keep driving." }
  ];
  const tierFor = score => TIERS.find(t => score >= t.min) || TIERS[TIERS.length - 1];

  /**
   * Score an offer 1-100.
   * offer: { pay, minutes, miles, stops }  (stops = total pickups + dropoffs; DoorDash's "2 stops" is a single order)
   * Returns { score, tier, pph, ppm, parts, reasons[] }.
   *
   * Method:
   *   1. base = 55% pay-per-hour curve + 45% pay-per-mile curve.
   *   2. Tier gates keep the label honest: an offer only reaches a tier if it clears that tier's
   *      floor rates, and clearing them guarantees at least the tier's minimum score.
   *        Trash  : under $15/hr, under $1/mi, or 25+ miles  -> capped at 25
   *        Rare   : needs ~$20/hr and ~$1.30/mi (19 / 1.25)   -> else capped at 50
   *        Epic   : needs $22/hr, $1.50/mi, 10 mi or less     -> else capped at 75
   *        Legend : needs $25/hr, $2/mi, one order, 6 mi or less -> else capped at 90
   *   3. Penalties come off after the gates, so they can drop an offer a tier:
   *        3+ stops: -7 per stop over 2 (max -21); pay under $5: -10; every mile over 12: -1.5 (max -15).
   */
  function scoreOffer(o) {
    const pay = +o.pay, minutes = +o.minutes, miles = +o.miles, stops = o.stops == null ? 2 : +o.stops;
    if (!(pay > 0) || !(minutes > 0) || !(miles > 0)) throw new Error("Need pay, minutes and miles above zero.");
    const pph = (pay / minutes) * 60, ppm = pay / miles;
    const reasons = [];

    const sPPH = curve(pph, PPH_CURVE), sPPM = curve(ppm, PPM_CURVE);
    let s = W_PPH * sPPH + W_PPM * sPPM;
    const base = s;

    const trash = pph < 15 || ppm < 1 || miles >= 25;
    const rare = pph >= 19 && ppm >= 1.25;
    const epic = pph >= 22 && ppm >= 1.5 && miles <= 10;
    const legend = pph >= 25 && ppm >= 2 && stops <= 2 && miles <= 6;

    if (trash) {
      s = Math.min(s, 25);
      if (pph < 15) reasons.push(`Under $15/hr ($${pph.toFixed(2)})`);
      if (ppm < 1) reasons.push(`Under $1/mi ($${ppm.toFixed(2)})`);
      if (miles >= 25) reasons.push(`Extreme distance (${miles} mi)`);
    } else if (legend) s = Math.max(s, 91);
    else if (epic) s = Math.min(Math.max(s, 76), 90);
    else if (rare) s = Math.min(Math.max(s, 51), 75);
    else s = Math.min(Math.max(s, 26), 50);

    let pen = 0;
    if (stops >= 3) { const p = Math.min(21, (stops - 2) * 7); pen += p; reasons.push(`${stops} stops (−${p})`); }
    if (pay < 5) { pen += 10; reasons.push(`Under $5 total (−10)`); }
    if (miles > 12) { const p = Math.min(15, Math.round((miles - 12) * 1.5)); pen += p; reasons.push(`${miles} mi trip (−${p})`); }
    s -= pen;

    const score = Math.max(1, Math.min(100, Math.round(s)));
    if (pph >= 25 && !trash) reasons.unshift(`$${pph.toFixed(2)}/hr is excellent`);
    else if (pph >= 20 && !trash) reasons.unshift(`$${pph.toFixed(2)}/hr clears $20`);
    if (ppm >= 2 && !trash) reasons.unshift(`$${ppm.toFixed(2)}/mi is excellent`);
    else if (ppm >= 1.5 && !trash) reasons.push(`$${ppm.toFixed(2)}/mi clears $1.50`);
    else if (ppm >= 1 && ppm < 1.3 && !trash) reasons.push(`$${ppm.toFixed(2)}/mi is thin`);

    return {
      score, tier: tierFor(score), pph, ppm,
      parts: { pph: Math.round(sPPH), ppm: Math.round(sPPM), base: Math.round(base), penalty: pen },
      reasons
    };
  }

  /* ---------- 3. Verdict: what the driver should do ---------- */
  // Rare and up pays enough to take; Common is a judgment call; Trash should be declined.
  function verdictFor(score) {
    if (score >= 51) return { id: "accept", label: "Accept", line: "This one pays. Take it." };
    if (score >= 26) return { id: "consider", label: "Consider", line: "Only if you're slow or it's on your way." };
    return { id: "decline", label: "Decline", line: "Not worth the gas. Skip it." };
  }

  /* ---------- 4. Card finish (the random "pull") ---------- */
  // Chance of each special finish by tier. Trash almost never gets one; Legendary usually does.
  const FINISH_ODDS = {
    trash:     { holo: 0.002, carbon: 0.004, inverted: 0.004 },   // 1% total
    common:    { holo: 0.02,  carbon: 0.03,  inverted: 0.03 },    // 8%
    rare:      { holo: 0.07,  carbon: 0.06,  inverted: 0.05 },    // 18%
    epic:      { holo: 0.20,  carbon: 0.10,  inverted: 0.06 },    // 36%
    legendary: { holo: 0.50,  carbon: 0.12,  inverted: 0.05 }     // 67%
  };
  const FINISHES = { holo: "Holographic", carbon: "Carbon Fiber", inverted: "Inverted" };
  /**
   * roll: a number in [0,1). Pass one derived from the image hash so the same screenshot
   * always gives the same finish (re-uploading can't re-roll it).
   */
  function rollFinish(tierId, roll) {
    const o = FINISH_ODDS[tierId] || FINISH_ODDS.common;
    let acc = 0;
    for (const k of ["holo", "carbon", "inverted"]) { acc += o[k]; if (roll < acc) return k; }
    return "standard";
  }

  /* Same offer seen twice (two screenshots seconds apart): same pay, time, miles and store. */
  const offerKey = o => [Math.round(+o.pay * 100), Math.round(+o.minutes), Math.round(+o.miles * 10),
    String(o.store || "").toLowerCase().replace(/[^a-z0-9]/g, "")].join("|");

  const api = { parseOfferText, scoreOffer, tierFor, TIERS, curve, PPH_CURVE, PPM_CURVE,
    verdictFor, rollFinish, FINISH_ODDS, FINISHES, offerKey };
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.OfferCore = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
"use strict";
const C=window.OfferCore,{TIERS,FINISHES,FINISH_ODDS}=C;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=v=>"$"+(+v).toFixed(2);
const TC={trash:"var(--t-trash)",common:"var(--t-common)",rare:"var(--t-rare)",epic:"var(--t-epic)",legendary:"var(--t-legendary)"};
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* ---------- storage (this browser only) ---------- */
const KEY="offerdex.v2";
let store={cards:[],next:1};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.cards))store=Object.assign(store,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));return true}catch(e){return false}}

/* ---------- duplicate detection ---------- */
async function sha256(blob){try{const b=await crypto.subtle.digest("SHA-256",await blob.arrayBuffer());return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return ""}}
/* 256-bit difference hash of the screen below the status bar; survives recompression, resizing and small crops */
function dHash(bm){
  const c=document.createElement("canvas");c.width=17;c.height=16;const x=c.getContext("2d",{willReadFrequently:true});
  const y0=Math.round(bm.height*0.06);x.imageSmoothingQuality="high";x.drawImage(bm,0,y0,bm.width,bm.height-y0,0,0,17,16);
  const d=x.getImageData(0,0,17,16).data,L=i=>0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];let hex="",n=0,k=0;
  for(let r=0;r<16;r++)for(let col=0;col<16;col++){n=(n<<1)|(L(r*17+col)<L(r*17+col+1)?1:0);if(++k%4===0){hex+=n.toString(16);n=0}}
  return hex;
}
const POP=[0,1,1,2,1,2,2,3,1,2,2,3,2,3,3,4];
const hamming=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=POP[parseInt(a[i],16)^parseInt(b[i],16)];return s};
/* same screenshot (exact or near-identical image) — different offers measure 60+ bits apart, re-saved copies under 10 */
const sameImage=(sha,ph)=>store.cards.find(c=>(sha&&c.sha===sha)||(ph&&c.ph&&c.ph.length===ph.length&&hamming(c.ph,ph)<=24));
/* same offer captured twice (timer or clock changed between screenshots) within 12 hours */
const sameOffer=o=>{const k=C.offerKey(o);return store.cards.find(c=>C.offerKey(c)===k&&Math.abs(Date.now()-new Date(c.ts))<12*3600e3)};

/* ---------- cards ---------- */
function makeCard(o,extra){
  const r=C.scoreOffer(o),roll=extra.roll??Math.random();
  return {id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),no:store.next++,
    store:o.store||"Mystery order",platform:o.platform||"",pay:+o.pay,minutes:+o.minutes,miles:+o.miles,stops:+o.stops||2,
    score:r.score,tier:r.tier.id,pph:r.pph,ppm:r.ppm,reasons:r.reasons,parts:r.parts,roll,finish:C.rollFinish(r.tier.id,roll),
    art:extra.art||"",sha:extra.sha||"",ph:extra.ph||"",ts:new Date().toISOString()};
}
function rescore(c,o){const r=C.scoreOffer(o);Object.assign(c,o,{score:r.score,tier:r.tier.id,pph:r.pph,ppm:r.ppm,reasons:r.reasons,parts:r.parts,finish:C.rollFinish(r.tier.id,c.roll)})}
const stars=t=>({trash:"",common:"★",rare:"★★",epic:"★★★",legendary:"★★★★"}[t]);
function serial(c){const d=new Date(c.ts);return (c.platform==="Uber Eats"?"UE":"DD")+"-"+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+String(c.no).padStart(3,"0")}
const FIN_SHORT={holo:"HOLO",carbon:"CARBON",inverted:"INVERTED"};
function cardHTML(c){
  const t=TIERS.find(x=>x.id===c.tier),f=c.finish&&c.finish!=="standard"?c.finish:"";
  const order=c.stops<=2?"Single order":Math.max(1,c.stops-1)+" dropoffs";
  return `<article class="card" data-t="${c.tier}"${f?` data-f="${f}"`:""} data-id="${esc(c.id)}" tabindex="0" aria-label="${esc(c.store)}, ${t.name} ${c.score}${f?", "+FINISHES[f]:""}">
  <div class="in">
    <div class="c-top"><span class="pill"><span class="orb"></span>${t.name}<b>${c.score}</b></span><span class="rate">$${c.pph.toFixed(0)}<small>/HR</small></span></div>
    <h3 class="c-name">${esc(c.store)}</h3>
    <div class="art">${c.art?`<img src="${c.art}" alt="" loading="lazy">`:`<div class="fallback">$${(+c.pay).toFixed(0)}</div>`}<span class="no">#${String(c.no).padStart(2,"0")}</span>${f?`<span class="fin">${FIN_SHORT[f]}</span>`:""}</div>
    <div class="strip">${c.miles} mi<i>•</i>${c.minutes} min<i>•</i>${esc(c.platform||"Delivery")}</div>
    <div class="box">
      <div class="val"><div><span>PAYOUT</span><b>${money(c.pay)}</b></div><div class="r"><span>CLASS</span><b>${order.toUpperCase()}</b></div></div>
      <div class="specs">
        <div><span>PER HOUR</span><b>${money(c.pph)}</b></div><div><span>PER MILE</span><b>${money(c.ppm)}</b></div>
        <div><span>DISTANCE</span><b>${c.miles} MI</b></div><div><span>STOPS</span><b>${c.stops}</b></div>
      </div>
      <p class="quote">${esc(t.blurb)}</p>
    </div>
    <div class="c-foot"><span>OFFERDEX</span><span class="rule"></span><span>NO. ${serial(c)} <b>${stars(c.tier)}</b></span></div>
  </div></article>`;
}
/* holo / sheen follows the finger or mouse */
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest('.card[data-f="holo"]');if(!c)return;const r=c.getBoundingClientRect();
  c.style.setProperty("--mx",((e.clientX-r.left)/r.width*100).toFixed(1)+"%");c.style.setProperty("--my",((e.clientY-r.top)/r.height*100).toFixed(1)+"%")},{passive:true});

/* ---------- home ---------- */
let filter="all",fresh=null;
function renderLadder(){
  const pct=t=>Math.round(Object.values(FINISH_ODDS[t]).reduce((a,b)=>a+b,0)*100);
  $("ladder").innerHTML=`<div class="lhead"><span>Rarity</span><span>Special finish odds</span></div>`+
    TIERS.map(t=>`<div class="lrow" style="--c:${TC[t.id]}"><i></i><b>${t.name}<small>${t.min}–${t.max}</small></b><span>${pct(t.id)}%</span></div>`).join("");
}
function renderHome(){
  const cs=store.cards;
  $("empty").hidden=!!cs.length;$("col").hidden=!cs.length;$("countBox").hidden=!cs.length;
  if(!cs.length){renderLadder();return}
  $("countN").textContent=cs.length;
  $("stBest").textContent=Math.max(...cs.map(c=>c.score));
  const tp=cs.reduce((a,c)=>a+c.pay,0),tm=cs.reduce((a,c)=>a+c.minutes,0);
  $("stPPH").textContent="$"+(tp/tm*60).toFixed(0);
  const spec=cs.filter(c=>c.finish&&c.finish!=="standard").length;$("stSpec").textContent=spec;
  const opts=[{id:"all",name:"All",n:cs.length},{id:"special",name:"Specials",n:spec,holo:1},...TIERS.map(t=>({id:t.id,name:t.name,n:cs.filter(c=>c.tier===t.id).length,c:TC[t.id]}))];
  $("filters").innerHTML=opts.filter(o=>o.id==="all"||o.n).map(o=>`<button class="fchip" data-f="${o.id}" aria-pressed="${filter===o.id}" style="--c:${o.c||"var(--mut)"}">${o.id==="all"?"":o.holo?'<i class="holo"></i>':"<i></i>"}${o.name} <span style="opacity:.6">${o.n}</span></button>`).join("");
  const shown=cs.filter(c=>filter==="all"||(filter==="special"?c.finish&&c.finish!=="standard":c.tier===filter)).slice().reverse();
  $("grid").innerHTML=shown.length?shown.map(cardHTML).join(""):`<div class="none">No cards here yet.</div>`;
  if(fresh){const el=$("grid").querySelector(`[data-id="${fresh}"]`);if(el)el.classList.add("new");fresh=null}
}
$("filters").onclick=e=>{const b=e.target.closest(".fchip");if(!b)return;filter=b.dataset.f;renderHome()};
$("grid").onclick=e=>{const c=e.target.closest(".card");if(c)openDetail(c.dataset.id)};
$("grid").onkeydown=e=>{if(e.key==="Enter"){const c=e.target.closest(".card");if(c)openDetail(c.dataset.id)}};
function goHome(){$("detailView").hidden=true;$("home").hidden=false;$("scanbar").hidden=false;renderHome()}

/* ---------- detail ---------- */
function openDetail(id){
  const c=store.cards.find(x=>x.id===id);if(!c)return;
  const v=C.verdictFor(c.score),f=c.finish&&c.finish!=="standard"?c.finish:"";
  const bar=(lab,val,col,txt)=>`<div class="brow"><span>${lab}</span><div class="tr"><i style="width:${Math.max(2,Math.min(100,val))}%;--c:${col}"></i></div><b>${txt}</b></div>`;
  $("detail").innerHTML=`<button class="close" id="dBack" aria-label="Back to your Dex" style="align-self:flex-start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>`+cardHTML(c)+`
   ${f?`<div class="pull ${f}" style="animation:none">${FINISHES[f]} finish</div>`:""}
   <div class="panel">
     <h2>${c.score} · ${v.label}</h2>
     <div class="tiers">${TIERS.slice().reverse().map(t=>`<div style="--c:${TC[t.id]}" class="${t.id===c.tier?"on":""}">${t.name}<br>${t.min}–${t.max}</div>`).join("")}</div>
     <div class="break">
       ${bar("Pay / hour",c.parts.pph,"var(--t-rare)",c.parts.pph)}
       ${bar("Pay / mile",c.parts.ppm,"var(--t-epic)",c.parts.ppm)}
       ${bar("Weighted",c.parts.base,"var(--gold)",c.parts.base)}
       ${c.parts.penalty?bar("Penalties",c.parts.penalty,"var(--decline)","−"+c.parts.penalty):""}
     </div>
     ${c.reasons.length?`<ul class="why-list">${c.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`:""}
   </div>
   <details class="panel"><summary style="color:var(--tx);font-weight:600;font-size:.95rem">Fix a misread number</summary>
     <div class="fields" style="margin-top:12px">${fieldsHTML("e",c)}</div>
     <button class="btn" id="eSave" style="margin-top:12px">Save and re-grade</button>
   </details>
   <button class="btn ghost" id="dDel" style="color:var(--decline)">Remove from Dex</button>`;
  $("home").hidden=true;$("scanbar").hidden=true;$("detailView").hidden=false;window.scrollTo(0,0);
  $("dBack").onclick=goHome;
  $("eSave").onclick=()=>{const o=readFields("e");if(!(o.pay>0&&o.minutes>0&&o.miles>0)){toast("Pay, time and miles must be above zero");return}
    rescore(c,o);save();toast("Re-graded: "+c.score);openDetail(c.id)};
  let armed=false;$("dDel").onclick=e=>{if(!armed){armed=true;e.target.textContent="Tap again to remove";return}
    store.cards=store.cards.filter(x=>x.id!==id);save();goHome();toast("Card removed")};
}
function fieldsHTML(p,o){return `
  <label>Pay ($)<input id="${p}Pay" type="number" inputmode="decimal" step="0.01" min="0" value="${o.pay??""}"></label>
  <label>Time (min)<input id="${p}Min" type="number" inputmode="numeric" step="1" min="0" value="${o.minutes??""}"></label>
  <label>Miles<input id="${p}Mi" type="number" inputmode="decimal" step="0.1" min="0" value="${o.miles??""}"></label>
  <label>Total stops<input id="${p}Stops" type="number" inputmode="numeric" step="1" min="1" value="${o.stops??2}"></label>
  <label class="full">Store<input id="${p}Store" type="text" maxlength="40" autocomplete="off" value="${esc(o.store||"")}" placeholder="Restaurant or store"></label>`}
const readFields=p=>({pay:parseFloat($(p+"Pay").value),minutes:parseFloat($(p+"Min").value),miles:parseFloat($(p+"Mi").value),stops:parseInt($(p+"Stops").value)||2,store:$(p+"Store").value.trim()});

/* ---------- OCR ---------- */
let worker=null;
async function getWorker(onProg){
  if(worker)return worker;
  const here=new URL("./assets/",location.href).href.replace(/\/$/,"");
  const logger=m=>onProg&&onProg(m);
  try{worker=await Tesseract.createWorker("eng",1,{workerPath:here+"/worker.min.js",corePath:here,langPath:here,workerBlobURL:false,logger})}
  catch(e){console.warn("Local OCR files unavailable, using the CDN",e);worker=await Tesseract.createWorker("eng",1,{logger})}
  return worker;
}
/* dark app UI: grayscale, invert, stretch contrast, upscale small screenshots; capped for iPhone memory */
function prep(bm,y0,y1){
  const sw=bm.width,sh=Math.round((y1-y0)*bm.height),k=Math.min(2,Math.max(0.5,1400/sw));
  const c=document.createElement("canvas");c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  const x=c.getContext("2d",{willReadFrequently:true});x.imageSmoothingQuality="high";
  x.drawImage(bm,0,Math.round(y0*bm.height),sw,sh,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){let v=255-(0.299*p[i]+0.587*p[i+1]+0.114*p[i+2]);v=(v-140)*1.8+140;p[i]=p[i+1]=p[i+2]=v<0?0:v>255?255:v}
  x.putImageData(d,0,0);return {c,k,off:Math.round(y0*bm.height)};
}
/* card art: the route map above the offer sheet */
function artFrom(bm,payY){
  const top=Math.round(bm.height*0.12);let bot=payY?payY-Math.round(bm.height*0.045):Math.round(bm.height*0.52);
  if(bot-top<bm.height*0.18)bot=Math.round(bm.height*0.52);
  const w=480,h=Math.round(w*(bot-top)/bm.width),c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(bm,0,top,bm.width,bot-top,0,0,w,h);
  const u=c.toDataURL("image/jpeg",0.7);c.width=c.height=0;return u;
}
const progress=(f,label)=>{$("pbar").style.width=Math.round(f*100)+"%";if(label)$("pstep").textContent=label};

/* ---------- scan flow ---------- */
let scanId=0;
function openSheet(){$("sheet").hidden=false;document.documentElement.classList.add("lock");$("sheet").scrollTop=0}
function closeSheet(){$("sheet").hidden=true;document.documentElement.classList.remove("lock");scanId++;$("file").value="";goHome();window.scrollTo({top:0,behavior:RM?"auto":"smooth"})}
$("sClose").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheet").hidden)closeSheet()});
const actions=(primary)=>`<div class="actions"><button class="btn ghost" data-act="home">Done</button><label class="btn" for="file" role="button">${primary||"Scan next"}</label></div>`;
$("sBody").onclick=e=>{const b=e.target.closest("[data-act]");if(b&&b.dataset.act==="home")closeSheet()};

async function scan(blob){
  const id=++scanId;
  openSheet();$("sBody").innerHTML="";$("status").hidden=false;
  const shot=$("shot");shot.hidden=false;shot.className="shot scanning";$("shotImg").src=URL.createObjectURL(blob);
  progress(0.03,"Checking your Dex");
  let bm=null,sha="",ph="";
  try{bm=await createImageBitmap(blob);[sha]=await Promise.all([sha256(blob)]);ph=dHash(bm)}catch(e){console.error(e)}
  if(id!==scanId)return;
  const dupImg=sameImage(sha,ph);
  if(dupImg){shot.classList.remove("scanning");showDuplicate(dupImg,"You've already scanned this screenshot.",()=>readOffer(id,bm,sha,ph));return}
  readOffer(id,bm,sha,ph);
}
async function readOffer(id,bm,sha,ph){
  const shot=$("shot");shot.classList.add("scanning");$("status").hidden=false;$("sBody").innerHTML="";
  let text="",payY=null,p={};
  try{
    if(!bm)throw new Error("couldn't open the image");
    let phase=0;
    const w=await getWorker(m=>{if(id!==scanId)return;if(m.status==="recognizing text")progress(0.35+0.6*((phase+m.progress)/2),"Reading the offer");else if(/load|initializ/.test(m.status))progress(0.06+0.28*(m.progress||0),"Loading the reader (first scan only)")});
    progress(0.35,"Reading the offer");
    const a=prep(bm,0.45,1),r1=(await w.recognize(a.c)).data;a.c.width=a.c.height=0;phase=1;text=r1.text;
    const pl=(r1.lines||[]).find(l=>/\$\s?\d/.test(l.text));if(pl)payY=a.off+Math.round(pl.bbox.y0/a.k);
    p=C.parseOfferText(text);
    if(p.pay==null||p.minutes==null||p.miles==null){
      const b=prep(bm,0,1),r2=(await w.recognize(b.c)).data;b.c.width=b.c.height=0;text+="\n----\n"+r2.text;
      const q=C.parseOfferText(r2.text);for(const k in q)if(p[k]==null)p[k]=q[k];
      if(!payY){const l2=(r2.lines||[]).find(l=>/\$\s?\d/.test(l.text));if(l2)payY=Math.round(l2.bbox.y0/b.k)}
    }
  }catch(e){console.error(e);text="(error: "+(e&&e.message||e)+")"}
  if(id!==scanId)return;
  const art=bm?artFrom(bm,payY):"";if(bm&&bm.close)bm.close();
  progress(1,"Done");
  if(p.store)p.store=titleCase(p.store);
  /* one deterministic roll per screenshot: re-uploading the same image can't re-roll the finish */
  const roll=sha?parseInt(sha.slice(0,8),16)/4294967296:Math.random();
  const ctx={art,sha,ph,roll,platform:p.platform||"",raw:text};
  const missing=["pay","minutes","miles"].filter(k=>!(p[k]>0));
  if(missing.length){shot.classList.remove("scanning");askFix(p,missing,ctx);return}
  grade(p,ctx);
}
function grade(p,ctx,skipDup){
  const o={pay:p.pay,minutes:p.minutes,miles:p.miles,stops:p.stops||2,store:p.store||"",platform:ctx.platform};
  if(!skipDup){const d=sameOffer(o);if(d){$("shot").classList.remove("scanning");showDuplicate(d,"This looks like the same offer: same pay, time, miles and store.",()=>grade(p,ctx,true));return}}
  const card=makeCard(o,ctx);store.cards.push(card);const saved=save();fresh=card.id;
  const v=C.verdictFor(card.score),f=card.finish!=="standard"?card.finish:"";
  $("status").hidden=true;
  const shot=$("shot");shot.classList.remove("scanning");shot.classList.add("gone");
  const why=card.reasons.filter(r=>!/clears|excellent/.test(r)).slice(0,2).join(" · ");
  $("sBody").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="verdict" data-v="${v.id}">
      <div class="vk">${esc(card.store)} · ${money(card.pay)}</div>
      <div class="vw">${v.label}</div>
      <div class="vl">${v.line}</div>
      <div class="vnums"><div><b>${money(card.pph)}</b><span>Per hour</span></div><div><b>${money(card.ppm)}</b><span>Per mile</span></div><div><b>${card.score}</b><span>Score</span></div></div>
      ${why?`<p class="vwhy">${esc(why)}</p>`:""}
    </div>
    ${f?`<div class="pull ${f}">✦ ${FINISHES[f]} pull ✦</div>`:""}
    <div class="reveal"><div class="burst" style="--bc:${f==="holo"?"#c44fff":TC[card.tier]}"></div>${cardHTML(card)}</div>
    ${saved?"":`<p class="msg err" style="text-align:center">This browser isn't saving cards (private mode?), so this one won't stay in your Dex.</p>`}
    ${actions()}
    <details><summary>Fix a misread number</summary><p class="msg" style="margin:6px 0 0">Tap the card in your Dex and choose "Fix a misread number".</p><pre>${esc(ctx.raw)}</pre></details>
  </div>`;
}
function askFix(p,missing,ctx){
  $("status").hidden=true;
  const names={pay:"pay",minutes:"time",miles:"miles"};
  $("sBody").innerHTML=`<div class="panel">
    <h2>Fill in what the scanner missed</h2>
    <p class="msg err">Couldn't read the ${missing.map(k=>names[k]).join(" and ")}. Copy ${missing.length>1?"them":"it"} from your screenshot.</p>
    <div class="fields">${fieldsHTML("f",p)}</div>
    <button class="btn" id="fGo" disabled>Grade this offer</button>
    <details><summary>Text the scanner read</summary><pre>${esc(ctx.raw)}</pre></details>
  </div>${actions("Scan a different one")}`;
  const check=()=>{const o=readFields("f");let ok=true;for(const [id,k] of [["fPay","pay"],["fMin","minutes"],["fMi","miles"]]){const bad=!(o[k]>0);$(id).classList.toggle("miss",bad);if(bad)ok=false}$("fGo").disabled=!ok};
  ["fPay","fMin","fMi"].forEach(id=>$(id).addEventListener("input",check));check();
  $("fGo").onclick=()=>grade(readFields("f"),ctx);
  const first=$(missing[0]==="pay"?"fPay":missing[0]==="minutes"?"fMin":"fMi");if(first&&!matchMedia("(hover:none)").matches)first.focus();
}
function showDuplicate(card,why,addAnyway){
  $("status").hidden=true;
  $("sBody").innerHTML=`<div class="dup">
      <h2>Already in your Dex</h2><p>${why}</p>
      <div class="mini">${cardHTML(card)}</div>
    </div>
    ${actions()}
    <button class="linkbtn" id="dupAdd">It's a different offer, add it anyway</button>`;
  $("dupAdd").onclick=addAnyway;
}
const titleCase=s=>/^[A-Z0-9'&\s-]+$/.test(s)&&s.length>4?s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()):s;

$("file").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)scan(f)};
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();const f=[...(e.dataTransfer?.files||[])].find(f=>f.type.startsWith("image/"));if(f)scan(f)});
document.addEventListener("paste",e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));if(it)scan(it.getAsFile())});
let tT;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("on"),1900)}

renderHome();
</script>
