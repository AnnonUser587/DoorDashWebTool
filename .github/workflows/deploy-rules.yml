# Publishes firestore.rules to Firebase automatically whenever it changes on GitHub.
# Uses the FIREBASE_SERVICE_ACCOUNT secret (it needs the "Firebase Rules Admin" role).
name: Publish Firestore rules
on:
  push:
    branches: [main]
    paths: [firestore.rules, .github/workflows/deploy-rules.yml, discord-bot/rules.js]
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node discord-bot/rules.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
