# Publishes firestore.rules to Firebase automatically whenever it changes on GitHub.
# Uses the FIREBASE_SERVICE_ACCOUNT secret you already have (it needs the "Firebase Rules Admin" role).
name: Publish Firestore rules
on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only firestore:rules --project dashercards-17860 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
